<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>foundation loading fixture</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #243044; color: #fff; font: 32px sans-serif; overflow: hidden; }
  #load { position: fixed; inset: 0; background: #1d1418; display: flex; align-items: center; justify-content: center; z-index: 2; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="load">Chargement… 17/20</div>
<canvas id="c" width="412" height="915"></canvas>
<script>
window.__sceneReady = false;
function paint() {
  var c = document.getElementById("c");
  c.width = window.innerWidth || 412;
  c.height = window.innerHeight || 915;
  var g = c.getContext("2d");
  g.fillStyle = "#243044";
  g.fillRect(0, 0, c.width, c.height);
  var x = Math.round(c.width * 0.36), y = Math.round(c.height * 0.18);
  var w = Math.round(c.width * 0.28), h = Math.round(c.height * 0.62);
  g.fillStyle = "#c4a46a";
  g.fillRect(x, y, w, h);
  g.fillStyle = "#f2ead8";
  g.fillRect(x + Math.round(w * 0.18), y + Math.round(h * 0.06), Math.round(w * 0.64), Math.round(h * 0.06));
}
setTimeout(function () {
  document.getElementById("load").style.display = "none";
  paint();
  window.__sceneReady = true;
}, 2500);
</script>
</body>
</html>
