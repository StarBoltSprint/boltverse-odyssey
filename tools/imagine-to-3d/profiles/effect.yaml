# imagine-to-3d type profile: effect (see _README.md). Gate thresholds come from tools/object-gate/profiles/effect.yaml
type: effect
desc: sand, dust, veils, smoke, sparks, god-rays (no solid mesh)
gate:
  profile: effect
  tighten: {}
views:
  count: 0
  note: 'no orbit views: Imagine sprite/flipbook sheets (grains, veils) cut from the key region'
  cameras: []
geometry:
  strategy: particles+imagine-sprites
  coarse: none
  depthRatio: 0.0
  hardEdges: false
  relief:
    maxM: 0.0
    minStdFrac: 0.0
    gradientMax: 0.0
