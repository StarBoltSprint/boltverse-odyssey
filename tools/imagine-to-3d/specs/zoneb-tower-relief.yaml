# Zone B tower facades (m2 m3 m4 m6): DA-V2 depth of each existing Imagine section plate,
# quantised to flat planes by the building profile (depth_relief.py mode hard-surface).
# No new Imagine images. Staging GLBs only. The live page is not this URL.
object: zoneb-tower-relief
type: building
crop: /workspace/zb-bible-1008/objects1-redo/crops/tA-ladder-slab.png
heightM: 88
work: /workspace/i23d-auto/zoneb-tower-relief
staging: /workspace/zb-preview-1008/objects1-t8
stagingUrl: http://127.0.0.1:8996/index-t8.html
shaderMatch: uZbA0
imagine:
  plateDir: /workspace/zb-preview-1008/objects1/tex
  plateGlob: ["sec/*.jpg", "sec5/*.jpg"]
  excludePlates: ["1", "11", "14"]   # retired section cells; the facade pool does not use them
geometry:
  generator: hard-surface
  reliefDir: /workspace/i23d-auto/zoneb-tower-relief/relief
  modules: [m2, m3, m4, m6]
  pxm: 85
  minPxPerM: 85
  maxStretch: 1.25
morph:
  gate: lod
gate:
  scene: /workspace/grokcli/wt/tower-relief-1010/tools/object-gate/specs/zone-b/scene.yaml
  full: true
  object: tower-m2
perf:
  # Graded R8 section atlases (method: 213 → 60 MiB). Shared chrome/trim/detail tiles stay on the live page.
  extraTexGlob: ["/workspace/zb-preview-1008/objects1/tex/sec6/*.png"]
