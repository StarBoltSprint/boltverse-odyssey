# Zone B mesas (key-city3 crop L): the reference run of imagine-to-3d auto. Reuses the existing Imagine images and the
# mesa worker's latest outputs read-only (shape = fused hull mesaF, geometry = strata5raw v10, packed = strata5).
object: zoneb-mesas
type: rock
key: /workspace/zb-bible-1008/key-city3.jpg
crop: /workspace/grokcli/wt/mesa-1009/in/crop-L.png
heightM: 45
work: /workspace/i23d-auto/zoneb-mesa
staging: /workspace/i23d-auto/zoneb-mesa/staging
imagine:
  views: {front: /workspace/mesa-1009/work/views/front.jpg, top: /workspace/mesa-1009/work/views/top.jpg}
  plates: /workspace/zb-preview-1008/mesas/plates/plates.json
  excludePlates: [w6]              # v10 review: brick grid
  detailSrc: /workspace/zb-preview-1008/mesas/hybrid
geometry:
  generator: strata2               # continuous strata (v10)
  hull: /workspace/mesa-1009/work/mesaA
  fusedHull: /workspace/mesa-1009/work/mesaF
  reliefDir: /workspace/mesa-1009/work/depth
  reuseShape: true
  reuseGeometry: /workspace/zb-preview-1008/mesas/strata5raw
  reusePacked: /workspace/zb-preview-1008/mesas/strata5
  placements: [[L-mid, 1.25], [L-mid2, 1.05], [L-far, 1.6], [R-butte, 1.7], [R-mid, 1.35], [R-band, 2.0], [B-left, 1.7], [B-right, 1.5], [B-far, 2.2]]
  iouMin: 0.87
  minPxPerM: 64
  maxStretch: 1.3
  minDistinctWallPlates: 9         # no-repetition rule needs ~9 distinct wall images for 9 mesas (PROGRESS-mesas 07:41)
detail:
  pxPerM: 512
  nearM: 15
  farM: 30
  rotDeg: 180
  slices:                          # [name, src stem in detailSrc, low-pass sigma px, height amp m, [band lo, hi] px]
  - [grit, m_face, 48, 0.010, [1.0, 60]]
  - [scree, m_scree, 64, 0.025, [1.0, 90]]
  - [sand, m_sand, 40, 0.006, [1.0, 60]]
morph:
  targets: [[L-mid, 216], [R-mid, 311]]
  farM: 300
  nearM: 10
gate: {scene: /workspace/grokcli/wt/object-gate/tools/object-gate/specs/zone-b/scene.yaml, object: mesa}
stagingUrl: http://127.0.0.1:8997/index.html   # KC staging mirror (kc_stage.py build --layout layouts/ember-mesa.json; serve --port 8997)
# 2026-10-10 (SmiR): locked palette + image consistency (stage consistency) and key-compare loop (stage keycompare).
palette:
  file: palettes/ember-mesa.json      # palette.py sample (key-city3 + object-gate key-compare masks + biome.json sampled)
  materials: {view: sandstone, plate: sandstone}
  keyRect: {sandstone: [0.0, 0.21, 0.24, 0.58]}
  strength: 0.8
  useGraded: false                    # true = downstream stages read the graded copies
keyCompare:
  spec: ../../object-gate/specs/zone-b/key-compare.yaml
  elements: [mesas, arch]
  camera: /workspace/zb-bible-1008/compare/run2/camera-key.json   # key camera = hero spawn, fov 58, heading 78 (layout fit 2026-10-10)
  maxRounds: 6
  stallRounds: 2
  colourGain: 0.8
  plates: {mesas: /workspace/zb-preview-1008/mesas/plates11/w*.jpg}
  apply:                              # run from tools/imagine-to-3d; {work} {element} {offsets} {warp} {ranking} {value} {job} {round}
    # every consumer writes into the KC STAGING mirror only (mesas/strata-kc, mesas/plates-kc, mesas/kc-params.json)
    colour: "python3 kc_mesa.py plates --stage /workspace/kc-staging/zb --offsets {offsets} --element {element}"
    shapeSeed: "ONLY=L-mid,L-mid2,L-far GEN=strata2.py KEY_CROP=/workspace/grokcli/wt/mesa-1009/in/crop-L.png IOU_MIN=0.9 MAX_SEEDS=20 RELIEF_DIR=/workspace/mesa-1009/work/depth python3 gen_strata_all.py /workspace/mesa-1009/work /workspace/mesa-1009/work/views/front.jpg /workspace/mesa-1009/work/views/top.jpg {work}/strata-kc-{round}"
    silhouetteWarp: "python3 kc_mesa.py warp --stage /workspace/kc-staging/zb --warp {warp} --camera /workspace/zb-bible-1008/compare/run2/camera-key.json --gain 0.8"
    plateRepick: "python3 kc_mesa.py plates --stage /workspace/kc-staging/zb --ranking {ranking} --element {element} --exclude w6"
    relief: {cmd: "python3 kc_mesa.py relief --stage /workspace/kc-staging/zb --value {value}", values: [1.5, 2.0, 0.6]}
    detail: {cmd: "python3 kc_mesa.py detail --stage /workspace/kc-staging/zb --value {value}", values: [1.3, 1.6, 0.8]}
    # shapeSeed regenerates strata (gen_strata_all) into {work}; it is NOT re-staged automatically (the strata-kc dir is
    # owned by the warp step) - its output is reported for review.
