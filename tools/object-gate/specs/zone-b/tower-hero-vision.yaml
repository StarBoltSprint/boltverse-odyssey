id: tower-hero
type: building
# Vision hero. Does not replace records/tower-hero.verified.yaml.
select: {names: "tower-hero"}
keyCrop: /workspace/i23d-auto/zoneb-tower-vision/vision/key-crop.jpg
record: records/tower-hero-vision.verified.yaml
selfReportKey: tower-hero
proportions:
  hOverW: [3.0, 5.0]
  dOverW: [0.81, 0.91]
  reason: from plates
# SmiR 2026-10-12: the 8 m phone row is WARN, not FAIL, when the native plate
# cannot get sharper. The number is still printed. Do not upscale.
nativePlateLimit:
  reason: "native face plates, no upscale"
textures:
  - {match: "vision/albedo", role: plate, source: /workspace/i23d-auto/zoneb-tower-vision/vision/key-crop.jpg}
  - {match: "vision/normal", role: plate, source: /workspace/i23d-auto/zoneb-tower-vision/vision/key-crop.jpg}
  - {match: "gdet-|detail-hp", role: detail}
checklist:
  - {id: wedge, feature: "Tapered planar blade, depth at least 0.45 of the width, sheared crown kept in the volume", captures: [far, low-portrait]}
  - {id: ladder, feature: "Ladder cage readable as rails, rungs and hoops", captures: [close, low-portrait], plateEvidence: absent, note: "No plate paints a ladder. Cables on the right plate are not rails."}
  - {id: chrome, feature: "Chrome or silver edge strips and floor bands readable as geometry", captures: [close, low-portrait]}
  - {id: damage, feature: "Sheared damaged crown kept in the silhouette", captures: [far, low-portrait]}
  - {id: sand, feature: "Sand on the lower part, base seated, no floating gap", captures: [low-portrait, far]}
