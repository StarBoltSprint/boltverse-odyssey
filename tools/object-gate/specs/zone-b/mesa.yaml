id: mesa
type: rock
select: {names: "^mesa-", exclude: "drifts"}
# 8 m render capture for visible px/m: the A/B test zone (mesa-1009/abtest/zone.json): mesa-L-mid, the wall facing the
# hero spawn / avenue (x -51.1, z 9.6), so the gate and the A/B sheets judge the same wall
visibleView: {hero: mesa-L-mid, towardXZ: [-51.115, 9.63]}
keyCrop: /workspace/grokcli/wt/mesa-1009/in/crop-L.png
textures:
  # Live v11 projects these Imagine plates in the shader (no uv). Sources match the served files byte for byte.
  - {match: "mesas/plates/b1\\.jpg|uB\\b", role: plate, projected: {metresAcross: 107.07}, source: "/workspace/grokcli/wt/mesa-1009/out2/b1.jpg"}
  - {match: "mesas/plates/c3\\.jpg|uC0\\b", role: plate, projected: {metresAcross: 107.07}, source: "/workspace/grokcli/wt/mesa-1009/out2/c3.jpg"}
  - {match: "mesas/plates/c4\\.jpg|uC1\\b", role: plate, projected: {metresAcross: 107.07}, source: "/workspace/grokcli/wt/mesa-1009/out2/c4.jpg"}
  - {match: "mesas/plates/w1\\.jpg", role: plate, projected: {metresAcross: 107.07}, source: "/workspace/grokcli/wt/mesa-1009/out2/w1.jpg"}
