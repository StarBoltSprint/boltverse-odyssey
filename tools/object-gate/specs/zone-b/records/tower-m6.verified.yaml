object: tower-m6
items:
  volume:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Close is a wall corner. Far shows several slabs and crops the near tower. Not the key's chimney-and-brace silhouette."
    captures: {close: "cc702622383060ea", far: "c030300040fffef6"}
  relief:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Close has a deep corner opening to the sky and a shutter slot. Low has recessed channels. No ladder cage or cornice."
    captures: {close: "cc702622383060ea", low-portrait: "8a3ba1e4c88de3c0"}
  damage:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Far shows slanted crowns on the distant slabs. The near tower is cropped, and no see-through hole is readable. Low does not show a sheared top."
    captures: {far: "c030300040fffef6", low-portrait: "8a3ba1e4c88de3c0"}
  materials:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Graphite panels, a shutter, and scratch marks. Chrome strips are not distinct."
    captures: {close: "cc702622383060ea"}
  colours:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Far keeps orange in the sand. The close wall is graphite under purple sky. Silver is not readable."
    captures: {close: "cc702622383060ea", far: "c030300040fffef6"}
  facade-sharp:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Close and low are a repeating rectangular panel quilt, with one deep corner opening."
    captures: {close: "cc702622383060ea", low-portrait: "8a3ba1e4c88de3c0"}
  base:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Low-portrait looks up the shaft. Sand contact is not in the frame."
    captures: {low-portrait: "8a3ba1e4c88de3c0"}
