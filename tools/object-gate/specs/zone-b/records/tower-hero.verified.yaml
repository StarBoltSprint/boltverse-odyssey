object: tower-hero
items:
  wedge:
    pass: true
    by: "grok-vision 2026-10-10"
    note: "The side cell of sheet.jpg shows a dark key face and a tan flank, so the blade has thickness. Low-portrait narrows toward a slanted crown. Far shows that tapered left silhouette next to a lattice neighbour. Silhouette depth/width is 0.580. The gate box is 0.92 because the plinth sits inside the AABB."
    captures: {far: "f399090d0543e0e4", low-portrait: "8e0f0c0f2f6f7efe"}
  ladder:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Close shows cables and a ladder-like mark that belong to the key photo on the face, then a flat maroon block. Rails, rungs, and hoops are not readable as a cage. Low-portrait shows none. The side cell has at most two thin edge lines."
    captures: {close: "8f0f2f3e3e4e0080", low-portrait: "8e0f0c0f2f6f7efe"}
  chrome:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Close and low-portrait show a warm edge highlight. Chrome floor bands and silver edge strips are not readable as their own geometry."
    captures: {close: "8f0f2f3e3e4e0080", low-portrait: "8e0f0c0f2f6f7efe"}
  damage:
    pass: true
    by: "grok-vision 2026-10-10"
    note: "Low-portrait and the key-camera cell keep the slanted crown. Far's left tower keeps the shear. The volume has no hole through it."
    captures: {far: "f399090d0543e0e4", low-portrait: "8e0f0c0f2f6f7efe"}
  sand:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Close and low-portrait end in a flat maroon block. Far shows sand on the ground beside the towers, not on the lower facade. The side cell shows the plinth meeting the sand. The grounding probe still reports 9.12 m of air under part of the body."
    captures: {low-portrait: "8e0f0c0f2f6f7efe", far: "f399090d0543e0e4"}
