object: tower-m4
items:
  volume:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Far shows distant slabs, with the near mass cropped at the right edge. Close is a wall. The key's sheared crown is not the subject in frame."
    captures: {close: "08283000206280a8", far: "c0f0cd0c0c88e0fc"}
  relief:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Close shows a corner side-wall and a dark horizontal slot. Low shows a rectangular opening to the sky. No ladder cage."
    captures: {close: "08283000206280a8", low-portrait: "8e03332261800381"}
  damage:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Distant slabs in the far frame have slanted tops. See-through holes are not clear, and the low frame does not show the sheared crown."
    captures: {far: "c0f0cd0c0c88e0fc", low-portrait: "8e03332261800381"}
  materials:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Close is a graphite panel field. Chrome strips are not a separate material."
    captures: {close: "08283000206280a8"}
  colours:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Orange stays in the sand and the sky rim. Towers stay dark. Silver is not readable."
    captures: {close: "08283000206280a8", far: "c0f0cd0c0c88e0fc"}
  facade-sharp:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Close and low read as a repeating panel quilt."
    captures: {close: "08283000206280a8", low-portrait: "8e03332261800381"}
  base:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Low-portrait looks up the shaft. The foot and the contact shadow are outside the frame."
    captures: {low-portrait: "8e03332261800381"}
