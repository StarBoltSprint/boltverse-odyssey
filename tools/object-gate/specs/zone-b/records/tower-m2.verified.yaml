object: tower-m2
items:
  volume:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Far is a tall panelled slab with the crown cut off. Close fills the frame with the wall. Neither shows the key wedge or the open side bay."
    captures: {close: "02899812120000a6", far: "c387030341fc9e80"}
  relief:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Close shows a panel grid and a small ladder at the bottom edge. Low shows the corner and dark channels. No ladder cage, fins, or cornices read as geometry."
    captures: {close: "02899812120000a6", low-portrait: "0207134974621b99"}
  damage:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Far crops the crown. Low looks up the shaft and shows no sheared top and no hole through to the sky."
    captures: {far: "c387030341fc9e80", low-portrait: "0207134974621b99"}
  materials:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Close is one dark graphite panel field. Chrome or silver strips are not a separate readable material."
    captures: {close: "02899812120000a6"}
  colours:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Far keeps orange in the sand under a purple sky and the slab stays dark. Silver is not readable on close or far, so the colour item does not pass."
    captures: {close: "02899812120000a6", far: "c387030341fc9e80"}
  facade-sharp:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Close and low read as a repeating rectangular panel quilt."
    captures: {close: "02899812120000a6", low-portrait: "0207134974621b99"}
  base:
    pass: false
    by: "grok-vision 2026-10-10"
    note: "Low-portrait looks up the shaft. The sand line and the contact shadow are outside the frame."
    captures: {low-portrait: "0207134974621b99"}
