<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>playcheck fixture</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud {
      position: fixed; left: 8px; top: 8px; z-index: 2;
      font: 11px/1.25 ui-monospace, monospace; color: #d7e6ea;
      text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre;
    }
    #stick {
      position: fixed; left: 18px; bottom: 28px; width: 92px; height: 92px;
      border: 1px solid rgba(255,255,255,.45); border-radius: 50%; z-index: 2;
    }
    #map {
      position: fixed; right: 16px; bottom: 36px; z-index: 2;
      width: 54px; height: 54px; border-radius: 50%;
      background: rgba(0,0,0,.25); color: #eee; border: 1px solid rgba(255,255,255,.4);
      font: 12px sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <div id="stick"></div>
  <button id="map" type="button">Map</button>
  <script src="perf-overlay.js"></script>
  <script src="sky-runtime.js"></script>
  <script src="play.js"></script>
</body>
</html>
