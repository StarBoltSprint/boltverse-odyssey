<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zone B — bench</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}canvas#view{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:16px system-ui}
#res{position:fixed;inset:0;z-index:100;background:#fff;color:#000;overflow:auto;padding:10px;font:15px/1.3 system-ui,sans-serif;display:none;touch-action:pan-y}
#res table{border-collapse:collapse;width:100%}#res td,#res th{border-bottom:1px solid #ccc;padding:5px 4px;text-align:right}#res td:first-child,#res th:first-child{text-align:left}
#res .bad{color:#b00;font-weight:700}#res .good{color:#070;font-weight:700}#res button{font-size:16px;padding:8px 14px;margin:6px 6px 0 0}</style>
</head><body>
<canvas id="view"></canvas>
<div id="load" style="z-index:5;background:#1d1418">Chargement… (bench ≈ 2 min 30, ne touche pas l'écran)</div>
<div id="tag" style="display:none"></div><div id="fps" style="display:none"></div><div id="help" style="display:none"></div><button id="run" style="display:none"></button>
<div id="stick" style="display:none"><div id="knob"></div></div>
<div id="res"></div>
<script>
window.__benchShow = (res, link) => {
  if (res.v >= 4) {   // v4: each row vs its OWN neighbouring base segments (ABAB), thermally fair
    const el = document.getElementById("res"), i = res.info;
    const tr = (r) => { const cls = r.p <= -5 ? "good" : r.p >= 5 ? "bad" : "";
      return `<tr><td>${r.n}</td><td>${r.b}</td><td><b>${r.ms}</b></td><td class="${cls}">${r.d > 0 ? "+" : ""}${r.d} (${r.p > 0 ? "+" : ""}${Math.round(r.p)}%)</td><td>${r.norm ?? ""}</td><td>${r.spread}</td></tr>`; };
    el.innerHTML = `<b>Zone B bench v4</b> ${res.t.slice(0, 16).replace("T", " ")} UTC<br>${i.gpu}<br>DPR ${i.dpr} · ${i.css} · buffer ${i.buf} · max tex ${i.maxTex} · aniso ${i.aniso} · ${i.ua} · calls ${i.calls} · tris ${i.tris}` +
      `<br>base froide (1re mesure) : <b>${res.base0} ms</b>` +
      `<table><tr><th>réglage</th><th>base</th><th>ms</th><th>Δ vs sa base</th><th>norm.</th><th>±</th></tr>${res.rows.map(tr).join("")}</table>
      <div style="font-size:12px;color:#555">Chaque ligne est mesurée en alternance base/réglage/base/réglage (1,2 s chacun) avec une pause entre les lignes : la chauffe du téléphone ne fausse plus la comparaison. base = sa propre base voisine ; norm. = ramené à la base froide ; ± = écart entre les 2 répétitions. (lossless) = image identique ; [diag] = change le rendu, pas proposé.</div>
      <button id="cp">Copier le lien du résultat</button><button id="again">Relancer</button>`;
    el.style.display = "block";
    document.getElementById("cp").onclick = async () => { try { await navigator.clipboard.writeText(link); document.getElementById("cp").textContent = "Lien copié ✓"; } catch { prompt("Lien :", link); } };
    document.getElementById("again").onclick = () => { location.href = "bench.html?opt=1&cap=2&lockq=1&dyn=0&hud=0&grain=0&cb=" + Date.now(); };
    return;
  }
  const el = document.getElementById("res"), rows = res.rows, v2 = res.v >= 2, key = v2 ? "ms" : "gpu";
  const mean = (a) => (a.length ? { [key]: +(a.reduce((t, r) => t + r[key], 0) / a.length).toFixed(1) } : null);
  const base = mean(rows.filter((r) => r.n.startsWith("base"))), baseD = mean(rows.filter((r) => r.n.startsWith("DOWN base")));
  const tr = (r) => { const b = r.n.startsWith("DOWN") ? baseD : base, isB = r.n.startsWith("base") || r.n.startsWith("DOWN base");
    const d = b ? r[key] - b[key] : 0, pc = b ? (100 * d) / b[key] : 0, cls = pc <= -10 ? "good" : pc >= 10 ? "bad" : "";
    return `<tr><td>${r.n}</td><td><b>${r[key]}</b></td><td class="${cls}">${isB ? "base" : (d > 0 ? "+" : "") + d.toFixed(1) + " (" + (pc > 0 ? "+" : "") + pc.toFixed(0) + "%)"}</td>` +
      (v2 ? `<td>${r.cpu}</td><td>${r.sync}</td>` : `<td>${r.raf}</td>`) + `</tr>`; };
  const i = res.info;
  el.innerHTML = `<b>Zone B bench v${res.v || 1}</b> ${res.t.slice(0, 16).replace("T", " ")} UTC<br>${i.gpu}<br>DPR ${i.dpr} · ${i.css} · buffer ${i.buf || "?"} · max tex ${i.maxTex} · aniso ${i.aniso} · ${i.ua}` +
  (v2 ? `<br>calls ${i.calls} · tris ${i.tris} · terrain tris ${i.terrainTris} · timer query ${i.timerQuery ? "yes" : "no"}` : "") +
  `<table><tr><th>réglage (avenue / DOWN = sol)</th><th>ms</th><th>Δ vs base</th>${v2 ? "<th>cpu</th><th>sync</th>" : "<th>rAF ms</th>"}</tr>${rows.map(tr).join("")}</table>
  <div style="font-size:12px;color:#555">${v2 ? "ms = coût par image en pipeline (3 rendus par image, sans lecture GPU, médiane) ; cpu = temps JS d'un rendu ; sync = ancienne mesure v1 (rendu + lecture 1 px)." : "GPU ms = rendu + attente GPU (médiane, sans vsync)."} base = tout activé, ratio 2 (moyenne des lignes base). [diag] = diagnostic seulement, change le rendu : pas proposé.</div>
  <button id="cp">Copier le lien du résultat</button><button id="again">Relancer</button>`;
  el.style.display = "block";
  document.getElementById("cp").onclick = async () => { try { await navigator.clipboard.writeText(link); document.getElementById("cp").textContent = "Lien copié ✓"; } catch { prompt("Lien :", link); } };
  document.getElementById("again").onclick = () => { location.href = "bench.html?opt=1&cap=2&lockq=1&dyn=0&hud=0&grain=0&cb=" + Date.now(); };
};
const h = location.hash.match(/#r=([\w-]+)/);
if (h) {
  const s = h[1].replace(/-/g, "+").replace(/_/g, "/");
  window.__benchShow(JSON.parse(decodeURIComponent(escape(atob(s + "===".slice((s.length + 3) % 4))))), location.href);
} else {
  if (!new URLSearchParams(location.search).has("lockq")) location.replace("bench.html?opt=1&cap=2&lockq=1&dyn=0&hud=0&grain=0&cb=" + Date.now());
  else {
    const s = document.createElement("script"); s.type = "module"; s.src = "./main-bench.mjs?b=9"; document.body.appendChild(s);
    const w = () => (window.__ready ? import("./bench.mjs?b=9") : setTimeout(w, 200)); w();
  }
}
</script>
</body></html>
