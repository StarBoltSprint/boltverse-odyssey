<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1d22">
<title>Zone B — terrain key (staging)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1d1418;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#view{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#tag{position:fixed;top:max(8px,env(safe-area-inset-top));left:10px;font:11px/1.3 system-ui,sans-serif;color:#fff;opacity:.8;text-shadow:0 1px 2px #000;pointer-events:none}
#fps{position:fixed;top:max(8px,env(safe-area-inset-top));right:10px;font:10px system-ui,sans-serif;color:#fff;opacity:.55;text-shadow:0 1px 2px #000;pointer-events:none}
#help{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font:11px system-ui,sans-serif;color:#fff;opacity:.7;text-shadow:0 1px 2px #000;pointer-events:none;white-space:nowrap;transition:opacity 1s}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:14px system-ui,sans-serif;color:#f3d6c4;background:#1d1418;z-index:5}
#run{position:fixed;right:22px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 36px);width:68px;height:68px;border-radius:50%;border:2px solid rgba(255,200,150,.7);background:rgba(40,20,20,.35);color:#ffd2b0;font:600 12px system-ui,sans-serif;z-index:3;touch-action:none}
#run.on{background:rgba(255,150,80,.55);color:#fff;border-color:#ffb089}
#stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.12);display:none;pointer-events:none;z-index:2}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,220,200,.5)}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="tag">Zone B — terrain key (staging) (tours phase 1, sans Bolt)</div>
<div id="fps"></div>
<div id="help">Gauche : marcher · Droite : regarder · ⚡ : courir</div>
<button id="run">⚡ Courir</button>
<div id="stick"><div id="knob"></div></div>
<div id="load">Chargement…</div>
<script type="module" src="./main.mjs?v=terrain-key"></script>
</body>
</html>
