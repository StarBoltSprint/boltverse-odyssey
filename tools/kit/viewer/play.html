<!doctype html>
<!-- tools/kit play viewer: kit GLB with library materials (hex-triplanar basalt + _SNOW snow mix),
     matte ice on icicles, snow ground (library tile at the wall + Zone D ground plate), Zone B mesa for scale.
     Spine v1.3.1 phone camera assumed: 412x915 CSS @1.5 DPR, vfov 48. ?view=key|3m|chase|45|grazing|side|scale
     Expects next to it: three.module.js, jsm/, hexTriplanar.js, model.glb, mesaA.glb, tex/ (see README). -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#9fb1c4;overflow:hidden}#hud{position:fixed;left:6px;top:6px;font:12px monospace;color:#fff;text-shadow:0 0 3px #000;white-space:pre}</style>
</head><body><div id="hud">loading…</div>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from './jsm/loaders/GLTFLoader.js';
import {applyHexTriplanar, probePxPerM} from './hexTriplanar.js';
const P = new URLSearchParams(location.search), view = P.get('view') || '3m';
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(+(P.get('dpr') || 1.5)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.shadowMap.enabled = P.get('shadows') !== '0'; renderer.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb1c4); scene.fog = new THREE.Fog(0x9fb1c4, 60, 320);
// light=key (default on view=key): moonlit key-image lighting (cool sky fill, low moon behind-left, as in key-zd1-b.jpg)
const KEYLIGHT = P.get('light') === 'key';   // opt-in: moonlit key light measured WORSE on the judge (34.8 -> 28.3)
scene.add(KEYLIGHT ? new THREE.HemisphereLight(0x9fb4e8, 0x2a3040, 1.1) : new THREE.HemisphereLight(0xdfe8f5, 0x6a6560, 1.3));
const sun = KEYLIGHT ? new THREE.DirectionalLight(0xc8d6ff, 1.4) : new THREE.DirectionalLight(0xfff4e6, 2.2);
if (KEYLIGHT) sun.position.set(-10, 12, -30); else sun.position.set(-20, 30, 25); scene.add(sun);
// shadows: door recesses / slab undersides read dark like the key (keysheet doorways); sun shadow box covers the terrace
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.target.position.set(4, 3, -4); scene.add(sun.target);
sun.position.add(new THREE.Vector3(4, 3, -4)); Object.assign(sun.shadow.camera, {left: -25, right: 25, top: 25, bottom: -25, near: 1, far: 120}); sun.shadow.bias = -0.0005;
if (KEYLIGHT) { scene.background = new THREE.Color(0x1c2340); scene.fog = new THREE.Fog(0x2a3350, 60, 320); }
const tl = new THREE.TextureLoader(), aniso = renderer.capabilities.getMaxAnisotropy();
const tex = (f, srgb = true) => { const t = tl.load('tex/' + f); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = aniso; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
const basalt = tex('basalt_albedo.jpg'), snow = tex('snow_albedo.jpg'), plate = tex('ground_plate.png');
// views (three frame = kit (x, z, -y); wall front at z=0, tier spans x -1..10.5, cornice ~4.3-5.0 m)
// spine v1.3.1 (git 89d9e684 steps/zone-d/01-terrace/spine.json): boom 4.5 m behind, 2.6 m up, vfov 48,
// aim 1.8 m above the feet and 6 m ahead. Player (1.8 m) stands 6 m from the wall facing it.
const PLAYER = [4.5, 0, 6.0];
const V = {
  key:     {pos: [-3.0598, 16.073, 30.3214], tgt: [9.9346, 6.8148, 4.916], up: [0.1304, 0.9511, -0.2799], fov: 80.017},
  '3m':    {pos: [4.5, 1.7, 3.0], tgt: [4.5, 2.0, 0]},
  chase:   {pos: [PLAYER[0], 2.6, PLAYER[2] + 4.5], tgt: [PLAYER[0], 1.8, PLAYER[2] - 6.0]},
  '45':    {pos: [4.5 + 2.83, 1.7, 2.83], tgt: [4.5, 2.0, 0]},
  grazing: {pos: [-3.2, 1.2, 0.9], tgt: [10, 2.6, -0.2]},
  side:    {pos: [-4.0, 3.4, 9.0], tgt: [2.5, 4.8, -0.5]},
  side4m:  {pos: [13.6, 4.4, 1.6], tgt: [10.0, 4.6, -0.5]},   // cornice free (right) end, ~4 m
  scale:   {pos: [-40, 22, 70], tgt: [30, 6, -40]},
}[view];
(V.fov || 48, innerWidth / innerHeight, 0.05, 1000);
// ground: wide Zone D plate, library snow tile strip at the wall foot
const g1 = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({map: plate, roughness: 0.95}));
plate.repeat.set(600 / 12, 600 / 12); g1.rotation.x = -Math.PI / 2; g1.position.y = -0.02; g1.receiveShadow = true; scene.add(g1);
// v8: the library snow tile reads purple-grey on screen (mean sRGB R113 G122 B166 vs plate R128 G154 B173):
// neutralise it toward the Zone D ground plate with a per-channel linear gain (plate/tile)^2.2
let SNOW_GAIN = [1.31, 1.66, 1.09];
// v10: the separate snow-tile pad under the kit is gone (Critic/AD: hard grey rectangle); the kit's own snow
// skirt meets the Zone D ground plate directly.
const snowWall = snow.clone(); snowWall.repeat.set(1, 1);
// matte ice: flat material (NO Imagine matte-ice texture in the library yet); bluish tint from the key icicles,
// slight translucency + cool emissive lift so drips do not read as white cones
const iceMat = new THREE.MeshStandardMaterial({color: 0x8fb6d3, roughness: 0.45, metalness: 0, transparent: true, opacity: 0.88, emissive: 0x1d3a52, emissiveIntensity: 0.6});
const gl = new GLTFLoader(); let tris = 0;
const [kit, mesa] = await Promise.all([gl.loadAsync(P.get('model') || 'model.glb'), gl.loadAsync('mesaA.glb')]);
// terrace kit GLBs carry the key-colour projection (linear gains vs the library albedo means) and the key-camera scale
const UX = kit.scene.userData || {};
if (UX.snowGain && P.get('gain') !== '0') SNOW_GAIN = UX.snowGain;
if (P.get('sg')) SNOW_GAIN = P.get('sg').split(',').map(Number);   // judge sweeps
const stoneMat = applyHexTriplanar(new THREE.MeshStandardMaterial({map: basalt, roughness: 0.92}), {tileM: 1.9, snowMap: snowWall, snowTileM: 1.2, snowGain: SNOW_GAIN, normalMap: tex('basalt_normal.jpg', false), normalStrength: 0.9});
stoneMat.defines = {HEX_SNOW: ''};
if (UX.keyGain && P.get('gain') !== '0') stoneMat.color.setRGB(...UX.keyGain);
if (P.get('kg')) stoneMat.color.setRGB(...P.get('kg').split(',').map(Number));
const ks = view === 'key' ? +(P.get('kscale') || UX.key_cam_scale || 1) : 1;   // solved key camera scaled about the kit origin
const camera = new THREE.PerspectiveCamera(V.fov || 48, innerWidth / innerHeight, 0.05, 1000);
camera.position.set(...V.pos.map(v => v * ks)); camera.up.set(...(V.up || [0, 1, 0])); camera.lookAt(...V.tgt.map(v => v * ks));
kit.scene.traverse(o => { if (!o.isMesh) return; tris += o.geometry.index.count / 3;
  const ia = o.geometry.attributes._ice;   // terrace GLBs write _ICE on every mesh (zeros on stone): use its values / the glTF material name
  o.material = /icicle/.test(o.name) || o.material.name === 'ice' || (ia && ia.array.some(v => v > 0.5)) ? iceMat : stoneMat;
  if (!o.geometry.attributes._snow) o.geometry.setAttribute('_snow', new THREE.Float32BufferAttribute(new Float32Array(o.geometry.attributes.position.count), 1)); });
// instancing: every glTF mesh shared by several nodes becomes ONE InstancedMesh (one draw per piece x material)
kit.scene.updateMatrixWorld(true);
const groups = new Map(); kit.scene.traverse(o => { if (o.isMesh) { const k = o.geometry.uuid + '|' + o.material.uuid + '|' + (o.matrixWorld.determinant() < 0 ? 'm' : 'p'); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(o); } });
let draws = 0;
for (const list of groups.values()) { draws++; if (list.length < 2) continue;
  const im = new THREE.InstancedMesh(list[0].geometry, list[0].material, list.length);
  im.name = list[0].name.replace(/_\d+$/, ''); im.userData.instanceOf = list.map(o => o.name);
  list.forEach((o, i) => im.setMatrixAt(i, o.matrixWorld)); im.instanceMatrix.needsUpdate = true; im.computeBoundingSphere();
  list.forEach(o => o.parent.remove(o)); kit.scene.add(im); }
// key view only: silhouette fit of the assembly to the SAM2 tier mask through the solved camera (tools/kit/keyfit.py),
// stored as a kit-frame offset; equivalent to re-seating the monocular key camera, the model itself is not moved.
if (view === 'key' && UX.keyfit_offset && P.get('fit') === '1') { const o = UX.keyfit_offset; kit.scene.position.set(o[0], o[2], -o[1]); }
kit.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
scene.add(kit.scene);
mesa.scene.traverse(o => { if (o.isMesh) o.material = new THREE.MeshStandardMaterial({color: 0x8a7563, roughness: 0.95}); if (/lod[12]/.test(o.name)) o.visible = false; });
mesa.scene.position.set(75, 7, -70);
if (view === 'scale') scene.add(mesa.scene);   // Critic v9: mesa is Zone B -> scale panel only
// 1.8 m player stand-in (capsule) for scale in every view
const pl = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 1.2, 4, 12), new THREE.MeshStandardMaterial({color: 0xc8402a, roughness: 0.6}));
pl.position.set(PLAYER[0], 0.9, PLAYER[2]); scene.add(pl);  // mesa base sits ~7 m below its origin
renderer.render(scene, camera);
const ray = new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(0, 0), camera);
const hit = ray.intersectObject(kit.scene, true)[0];
const px = hit ? probePxPerM(renderer, camera, hit.distance, 1024, 1.9) : null;
window.__probe = {view, tris, draws, keyCamScale: ks, hitM: hit ? +hit.distance.toFixed(2) : null, px};
document.getElementById('hud').textContent = `${view}  tris ${tris}\nhit ${hit ? hit.distance.toFixed(2) + ' m' : '-'}  ` +
  (px ? `screen ${px.screenPxPerM.toFixed(0)} px/m  stone ${px.texPxPerM.toFixed(0)} px/m${px.magnified ? ' MAGNIFIED' : ''}` : '') +
  `\n${renderer.getContext().getParameter(renderer.getContext().VERSION)}`;
// gatesuite playgate: everything the page draws, with its source (build GLB vs page furniture)
const inv = []; scene.traverse(o => { if (!o.isMesh) return; let n = o, src = 'page'; while (n) { if (n === kit.scene) src = 'build'; n = n.parent; }
  inv.push({name: o.name, instances: o.isInstancedMesh ? o.count : 1, visible: o.visible, drawn: o.visible, doubleSided: o.material.side === THREE.DoubleSide, glb_doubleSided: !!(o.userData.gltfDoubleSided), source: src}); });
window.__inventory = inv;
if (P.get('hud') === '0') document.getElementById('hud').style.display = 'none';
renderer.render(scene, camera); window.__ready = true;
</script></body></html>
